{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <title>Регистрация — УлТрек</title>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="brand">
                <div class="brand-name">УлТрек</div>
                <div class="brand-sub">Поездки по городу</div>
            </div>

            <h1>Регистрация</h1>

            <form method="post" class="auth-form">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit">Зарегистрироваться</button>
            </form>

            <div class="form-footer">
                Уже есть аккаунт? <a href="{% url "login" %}">Войти</a>
            </div>
        </div>
    </div>
</body>
</html>
