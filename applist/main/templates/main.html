{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <title>Главная — УлТрек</title>
</head>
<body>
    <div class="container wide">
        <div class="card">
            <div class="brand">
                <div class="brand-name">УлТрек</div>
                <div class="brand-sub">Поездки по городу</div>
            </div>

            <div class="hero">
                <h1>Главная</h1>
                <p>Добро пожаловать в УлТрек</p>
            </div>

            {% if user.is_authenticated %}
                <p class="greeting">
                    Привет, <strong>{{ user.username }}</strong>
                    <span class="role-badge">{{ user.profile.role }}</span>
                </p>
                <a href="{% url 'logout' %}" class="logout-link">Выйти</a>
            {% else %}
                <p class="muted">Вы не вошли.</p>
                <a href="{% url 'login' %}">Войти</a>
            {% endif %}
        </div>
    </div>
</body>
</html>
